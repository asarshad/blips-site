<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
  <title id="t">Blips app preview (illustration)</title>
  <desc id="d">An illustrated phone mock showing the Blips app feed, videos, and reels tabs.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="transparent"/>

  <!-- Phone body -->
  <g filter="url(#shadow)">
    <rect x="380" y="60" width="440" height="680" rx="56" fill="#0b1020" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>
    <rect x="400" y="96" width="400" height="608" rx="42" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  </g>

  <!-- Status bar -->
  <g>
    <rect x="430" y="120" width="340" height="28" rx="14" fill="rgba(255,255,255,0.06)"/>
    <circle cx="452" cy="134" r="6" fill="rgba(255,255,255,0.7)"/>
    <rect x="468" y="129" width="70" height="10" rx="5" fill="rgba(255,255,255,0.22)"/>
    <rect x="702" y="129" width="46" height="10" rx="5" fill="rgba(255,255,255,0.22)"/>
  </g>

  <!-- App header -->
  <g>
    <rect x="430" y="162" width="340" height="48" rx="16" fill="rgba(255,255,255,0.08)"/>
    <rect x="446" y="174" width="28" height="28" rx="10" fill="url(#g)"/>
    <text x="486" y="196" fill="rgba(255,255,255,0.92)" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="20" font-weight="800">Blips</text>
    <rect x="674" y="176" width="84" height="22" rx="11" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.12)"/>
    <text x="688" y="192" fill="rgba(255,255,255,0.75)" font-family="system-ui, -apple-system" font-size="12" font-weight="700">For you</text>
  </g>

  <!-- Feed cards -->
  <g>
    <rect x="430" y="226" width="340" height="116" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)"/>
    <rect x="446" y="244" width="160" height="14" rx="7" fill="rgba(255,255,255,0.32)"/>
    <rect x="446" y="266" width="290" height="12" rx="6" fill="rgba(255,255,255,0.18)"/>
    <rect x="446" y="286" width="260" height="12" rx="6" fill="rgba(255,255,255,0.18)"/>
    <rect x="446" y="312" width="84" height="18" rx="9" fill="rgba(124,58,237,0.26)"/>
    <text x="456" y="325" fill="rgba(255,255,255,0.75)" font-family="system-ui, -apple-system" font-size="11" font-weight="700">ARTICLE</text>

    <rect x="430" y="354" width="340" height="168" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)"/>
    <rect x="446" y="372" width="308" height="92" rx="14" fill="rgba(255,255,255,0.10)"/>
    <circle cx="600" cy="418" r="18" fill="rgba(255,255,255,0.85)"/>
    <polygon points="594,408 594,428 614,418" fill="#0b1020"/>
    <rect x="446" y="474" width="220" height="12" rx="6" fill="rgba(255,255,255,0.22)"/>
    <rect x="446" y="494" width="180" height="12" rx="6" fill="rgba(255,255,255,0.18)"/>
  </g>

  <!-- Bottom tabs -->
  <g>
    <rect x="430" y="536" width="340" height="62" rx="18" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.12)"/>
    <rect x="452" y="552" width="78" height="30" rx="15" fill="rgba(255,255,255,0.10)"/>
    <text x="470" y="572" fill="rgba(255,255,255,0.85)" font-family="system-ui, -apple-system" font-size="12" font-weight="700">Feed</text>

    <rect x="546" y="552" width="78" height="30" rx="15" fill="rgba(255,255,255,0.06)"/>
    <text x="562" y="572" fill="rgba(255,255,255,0.72)" font-family="system-ui, -apple-system" font-size="12" font-weight="700">Videos</text>

    <rect x="640" y="552" width="78" height="30" rx="15" fill="rgba(255,255,255,0.06)"/>
    <text x="660" y="572" fill="rgba(255,255,255,0.72)" font-family="system-ui, -apple-system" font-size="12" font-weight="700">Reels</text>
  </g>

  <!-- Caption tag (non-claiming) -->
  <g>
    <rect x="420" y="628" width="360" height="56" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="442" y="660" fill="rgba(255,255,255,0.70)" font-family="system-ui, -apple-system" font-size="13">
      Illustration — replace with real screenshots anytime.
    </text>
  </g>
</svg>
